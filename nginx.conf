map $uri $frontend_cache_control {
  default "no-cache";
  ~^/assets/ "public, max-age=31536000, immutable";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  include /etc/nginx/mime.types;
  include /etc/nginx/api-location.conf;
  add_header Cache-Control $frontend_cache_control;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location = /health { access_log off; default_type text/plain; return 200 'ok'; }
  location /assets/ { try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
